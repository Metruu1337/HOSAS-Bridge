name: Feature request
description: Suggest a focused improvement
body:
  - type: markdown
    attributes:
      value: "Do not post private identifiers, credentials or unreviewed logs. Security issues follow SECURITY.md."
  - type: textarea
    id: field_0
    attributes:
      label: "Problem or user need"
    validations:
      required: true
  - type: textarea
    id: field_1
    attributes:
      label: "Proposed behavior"
    validations:
      required: true
  - type: textarea
    id: field_2
    attributes:
      label: "Alternatives and scope"
    validations:
      required: false
