name: Device compatibility
description: Report controller support
body:
  - type: markdown
    attributes:
      value: "Do not post private identifiers, credentials or unreviewed logs. Security issues follow SECURITY.md."
  - type: textarea
    id: field_0
    attributes:
      label: "App version / Windows version"
    validations:
      required: true
  - type: textarea
    id: field_1
    attributes:
      label: "Product name and manufacturer"
    validations:
      required: true
  - type: textarea
    id: field_2
    attributes:
      label: "VID/PID"
    validations:
      required: false
  - type: textarea
    id: field_3
    attributes:
      label: "Axes / buttons / POV counts"
    validations:
      required: false
  - type: textarea
    id: field_4
    attributes:
      label: "Sanitized Copy Device Info output"
    validations:
      required: false
  - type: textarea
    id: field_5
    attributes:
      label: "Tested mappings and results"
    validations:
      required: false
