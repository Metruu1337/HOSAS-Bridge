name: Game profile request
description: Propose a game preset
body:
  - type: markdown
    attributes:
      value: "Do not post private identifiers, credentials or unreviewed logs. Security issues follow SECURITY.md."
  - type: textarea
    id: field_0
    attributes:
      label: "Game and version"
    validations:
      required: true
  - type: textarea
    id: field_1
    attributes:
      label: "Controllers"
    validations:
      required: true
  - type: textarea
    id: field_2
    attributes:
      label: "Routing strategy"
    validations:
      required: false
  - type: textarea
    id: field_3
    attributes:
      label: "Desired mappings and modes"
    validations:
      required: false
  - type: textarea
    id: field_4
    attributes:
      label: "What has actually been tested"
    validations:
      required: false
