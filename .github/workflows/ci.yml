name: Build and test
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Verify official native dependencies
        shell: pwsh
        run: ./scripts/Fetch-Dependencies.ps1
      - run: dotnet restore HOSASBridge.slnx --locked-mode
      - run: dotnet build HOSASBridge.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test HOSASBridge.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Validate localization
        shell: pwsh
        run: ./scripts/Validate-Localization.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14
