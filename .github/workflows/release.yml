name: Release candidate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Verify tag and install pinned compiler
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag/version mismatch' }
          ./scripts/Install-BuildTools.ps1
      - name: Build, test and package
        shell: pwsh
        env:
          BUILD_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILD_TAG: ${{ github.ref_name }}
        run: ./scripts/Build.ps1 -Dotnet dotnet -SkipSmoke
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            artifacts/HOSASBridge-*.zip
            artifacts/installer/HOSASBridge-*.exe
            artifacts/SBOM.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-beta-candidate
          path: |
            artifacts/HOSASBridge-*.zip
            artifacts/installer/HOSASBridge-*.exe
            artifacts/SHA256SUMS.txt
            artifacts/SBOM.cdx.json
            artifacts/build-metadata.json
            artifacts/test-results
          if-no-files-found: error
          retention-days: 30
